# ponytail: 一人一个容器,共用镜像。多人预约不改代码 —— booker 是
# single-shot 且 state 按目录隔离,复制一个 service 就是第二个人。
x-poller: &poller
  image: tokyo-dl-poll:latest
  build: .
  restart: unless-stopped
  environment: &poller-env
    POLL_INTERVAL: "180"   # 3 分钟,ADR-8
    # DL_RES_FLAGS 在各自的 .env.local 里设(每人不同,且服务器上不必改本文件)

services:
  me:
    <<: *poller
    hostname: me
    env_file: .env.local
    volumes:
      - ./config.local.json:/app/config.local.json:ro
      - ./state:/app/state

  # 一键取消:Bark 推送里的链接指到这里。手机经 Tailscale 访问。
  cancel-me:
    <<: *poller
    env_file: .env.local
    command: dl-cancel-server --state /app/state/snapshot.json
    ports:
      - "8787:8787"
    volumes:
      - ./state:/app/state

  partner:
    <<: *poller
    hostname: partner
    env_file: .env.partner.local
    environment:
      <<: *poller-env
      START_DELAY: "90"    # 错开半个周期,别和 me 同一秒打上游
    volumes:
      - ./config.partner.local.json:/app/config.local.json:ro
      - ./state-partner:/app/state
